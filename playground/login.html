<!doctype html><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="style.css">
<h1>Sign in</h1>
<form id="f">
  <label>Email <input id="email" type="email"></label>
  <label>Password <input id="password" type="password"></label>
  <button>Sign in</button>
</form>
<div id="msg"></div>
<script src="fake.js"></script>
<script>
  document.querySelector('#f').addEventListener('submit', (e) => {
    e.preventDefault();
    const pw = document.querySelector('#password');
    const value = pw.value;
    pw.value = ''; // like many real sites, clear the field on submit
    fakeSubmit(value, () => { location.href = 'welcome.html'; });
  });
</script>
