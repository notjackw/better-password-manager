<!doctype html><meta charset="utf-8"><title>Sports News</title><link rel="stylesheet" href="style.css">
<style>
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); }
  #overlay iframe { width: 100%; height: 100%; border: 0; }
</style>
<h1>Sports News</h1>
<p id="state">Not signed in.</p>
<button id="open">Log In</button>
<script>
  // Like espn.com: the login is a full-screen iframe from another site, and the URL never changes.
  document.querySelector('#open').addEventListener('click', () => {
    const overlay = document.createElement('div');
    overlay.id = 'overlay';
    const frame = document.createElement('iframe');
    frame.id = 'login-frame';
    frame.src = `http://127.0.0.1:${location.port}/frame-login.html`;
    overlay.append(frame);
    document.body.append(overlay);
  });
  window.addEventListener('message', (e) => {
    if (e.data !== 'login-ok') return;
    document.querySelector('#overlay')?.remove();
    document.querySelector('#state').textContent = 'Signed in.';
  });
</script>
