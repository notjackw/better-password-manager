<!doctype html><meta charset="utf-8"><title>Reset password</title><link rel="stylesheet" href="style.css">
<h1>Choose a new password</h1>
<form id="f">
  <input id="p1" type="password" placeholder="New password">
  <input id="p2" type="password" placeholder="Repeat it">
  <button>Reset password</button>
</form>
<div id="msg"></div>
<script src="fake.js"></script>
<script>
  document.querySelector('#f').addEventListener('submit', (e) => {
    e.preventDefault();
    fakeSubmit(document.querySelector('#p1').value, () => { location.href = 'welcome.html'; });
  });
</script>
